<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mini Shop</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f5f5;
      }

      .card-produto {
        transition: 0.3s,
      }

      .card-produto:hover {
        transform: scale(1.03);
      }

      .imagem-produto {
        height: 220px;
        object-fit: contain;
      }

      .imagem-detalhe {
        max-height: 400px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <!-- MENU -->
    <nav class="navbar navbar-dark bg-dark px-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"> Mini Shop </span>
      </div>
    </nav>

    <!-- CONTAINER -->
    <div class="container mt-5">
      <!-- TITULO -->
      <h1 class="fw-bold display-4">Produtos em destaque</h1>

      <p class="text-secondary fs-4">Consumindo API com Bootstrap</p>

      <!-- PRODUTOS -->
      <div id="listaProdutos" class="row g-4 mt-2"></div>

      <!-- DETALHE -->
      <div id="areaDetalhe" class="card mt-5 p-4 d-none">
        <div class="row align-items-center">
          <!-- IMAGEM -->
          <div class="col-md-5 text-center">
            <img id="detalheImagem" class="img-fluid imagem-detalhe"alt= Imagem detalhada do produto ${produto.title} />
          </div>

          <!-- TEXTO -->
          <div class="col-md-7">
            <p id="detalheCategoria" class="text-uppercase text-secondary"></p>

            <h2 id="detalheTitulo" class="fw-bold"></h2>

            <p id="detalheDescricao" class="text-secondary fs-5"></p>

            <h3 id="detalhePreco" class="text-success fw-bold"></h3>

            <button class="btn btn-success btn-lg mt-3">Comprar agora</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // div onde os produtos vao aparecer
      const listaProdutos = document.getElementById("listaProdutos");

      // area do detalhe
      const areaDetalhe = document.getElementById("areaDetalhe");

      // campos do detalhe
      const detalheImagem = document.getElementById("detalheImagem");

      const detalheCategoria = document.getElementById("detalheCategoria");

      const detalheTitulo = document.getElementById("detalheTitulo");

      const detalheDescricao = document.getElementById("detalheDescricao");

      const detalhePreco = document.getElementById("detalhePreco");

      // função para buscar produtos
      async function buscarProdutos() {
        // acessando api
        const resposta = await fetch("https://fakestoreapi.com/products");

        // convertendo para json
        const produtos = await resposta.json();

        // percorrendo produtos
        produtos.forEach((produto) => {
          // criando coluna
          const coluna = document.createElement("div");

          coluna.className = "col-md-3";

          // criando card
          coluna.innerHTML = `
                
                    <div class="card h-100 shadow-sm card-produto">

                        <img
                            src="${produto.image}"
                            class="card-img-top p-4 imagem-produto"
                        >

                        <div class="card-body d-flex flex-column">

                            <small class="text-uppercase text-secondary">
                                ${produto.category}
                            </small>

                            <h5 class="mt-2">
                                ${produto.title}
                            </h5>

                            <h3 class="text-success fw-bold mt-3">
                                R$ ${produto.price}
                            </h3>

                            <button
                                class="btn btn-primary mt-auto"
                                onclick='mostrarDetalhe(${JSON.stringify(produto)})'
                            >
                                Ver produto
                            </button>

                        </div>

                    </div>

                `;

          // adicionando card na tela
          listaProdutos.appendChild(coluna);
        });
      }

      // função mostrar detalhe
      function mostrarDetalhe(produto) {
        // mostrando area
        areaDetalhe.classList.remove("d-none");

        // colocando dados
        detalheImagem.src = produto.image;

        detalheCategoria.innerText = produto.category;

        detalheTitulo.innerText = produto.title;

        detalheDescricao.innerText = produto.description;

        detalhePreco.innerText = `R$ ${produto.price}`;

        // scroll suave
        areaDetalhe.scrollIntoView({
          behavior: "smooth",
        });
      }

      // executando função
      buscarProdutos();
    </script>
  </body>
</html>
